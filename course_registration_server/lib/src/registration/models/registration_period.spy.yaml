class: RegistrationPeriod
table: registration_periods
fields:
  id: UuidValue?, defaultPersist=random_v7
  semester: Semester?, relation(onDelete=Cascade)
  startTime: DateTime
  endTime: DateTime
  lecturerStartTime: DateTime
  lecturerEndTime: DateTime
  status: RegistrationPeriodStatus, defaultModel=draft
  updatedBy: Admin?, relation(optional, onDelete=SetNull)
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  registration_periods_semester_unique:
    fields: semesterId
    unique: true
  registration_periods_window_idx:
    fields: startTime, endTime
