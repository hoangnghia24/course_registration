class: TrainingProgram
table: training_programs
fields:
  id: UuidValue?, defaultPersist=random_v7
  major: Major?, relation(onDelete=Restrict)
  code: String
  name: String
  academicYear: int
  totalCredits: int
  semesterCount: int
  status: TrainingProgramStatus, defaultModel=draft
  description: String?
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  training_programs_code_unique:
    fields: code
    unique: true
  training_programs_major_year_unique:
    fields: majorId, academicYear
    unique: true
